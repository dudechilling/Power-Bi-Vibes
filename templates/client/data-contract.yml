contract_version: 1

source:
  type: <xlsx|csv|sqlite|other>
  development_representation: <synthetic|scrubbed-template|approved-real-sample|schema-only>
  source_parameter_name: <Power Query parameter name>
  development_location: <relative synthetic path or approved development location>
  production_location: <local/organizational location configured outside shared fixtures>
  object: <worksheet/table/view if applicable>

canonical_fields:
  - name: <stable_internal_name>
    source_names:
      - <current source header>
    type: <text|integer|decimal|date|datetime|boolean|url>
    required: true
    nullable: false
    key: false
    business_definition: <plain-language meaning>
    display_label: <user-facing label>
    sensitivity: <public|internal|restricted|unknown>
    notes: null

relationships: []

adapter_rules:
  allow_extra_source_fields: true
  fail_on_missing_required_fields: true
  trim_text: true
  source_specific_rules: []

synthetic_fixture:
  seed: <fixed project seed>
  target_rows: <choose for project>
  required_cases: []

known_caveats: []
