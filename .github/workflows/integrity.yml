name: Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install system PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ghostscript

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip reportlab pyyaml

      - name: Rebuild client guide
        run: python tools/build-guide.py

      - name: Audit repository integrity
        run: python tools/repo-integrity.py

      - name: Render all PDF pages with Poppler
        run: |
          mkdir -p /tmp/pbv-render
          pdftoppm -png -r 120 docs/Power-BI-Vibes-Guide.pdf /tmp/pbv-render/page >/dev/null
          test "$(find /tmp/pbv-render -name 'page-*.png' | wc -l)" -ge 1
          if find /tmp/pbv-render -name 'page-*.png' -size 0 -print -quit | grep -q .; then
            echo "A rendered PDF page is empty on disk."
            exit 1
          fi

      - name: Commit verified guide build when its source changed
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          changed="$(git diff --name-only "$BEFORE" "$HEAD_SHA" -- VERSION docs/getting-started.md tools/build-guide.py || true)"
          if [ -z "$changed" ]; then
            echo "Guide inputs unchanged; verified build will not be committed."
            exit 0
          fi

          git add docs/Power-BI-Vibes-Guide.pdf
          if git diff --cached --quiet; then
            echo "Verified PDF is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: rebuild verified client guide [skip ci]"
          git push

  inspect-source-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply Windows PowerShell nullable compatibility fix
        if: github.event_name == 'push'
        shell: powershell
        run: |
          $sourcePath = 'tools/inspect-source.ps1'
          $source = [System.IO.File]::ReadAllText($sourcePath)
          $source = $source.Replace('param([string]$ResolvedPath, [Nullable[int]]$HeaderRowOverride)', 'param([string]$ResolvedPath, $HeaderRowOverride)')
          $source = $source.Replace('$HeaderRowOverride.Value', '[int]$HeaderRowOverride')
          $source = $source.Replace('[Nullable[int]]$HeaderRow', '[int]$HeaderRow')
          [System.IO.File]::WriteAllText($sourcePath, $source, [System.Text.UTF8Encoding]::new($false))

          $testPath = 'tools/test-inspect-source.ps1'
          $test = [System.IO.File]::ReadAllText($testPath)
          $test = $test.Replace('[Nullable[int]]$HeaderRowValue', '[int]$HeaderRowValue')
          $test = $test.Replace('$HeaderRowValue.Value', '$HeaderRowValue')
          [System.IO.File]::WriteAllText($testPath, $test, [System.Text.UTF8Encoding]::new($false))

      - name: Exercise inspect-source on Windows PowerShell
        shell: powershell
        run: .\tools\test-inspect-source.ps1

      - name: Commit verified Windows compatibility fix
        if: github.event_name == 'push'
        shell: powershell
        run: |
          git add tools/inspect-source.ps1 tools/test-inspect-source.ps1
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Windows compatibility fix is already committed.'
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: support header override on Windows PowerShell [skip ci]"
          git push
